name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy phd_matcher

      - name: Test
        run: pytest

      - name: Verify console scripts installed
        run: |
          phdtaketaketake-match --help > /dev/null
          phdtaketaketake-audit --help > /dev/null
          phdtaketaketake-collect-evidence --help > /dev/null
          phdtaketaketake-discovery-plan --help > /dev/null
