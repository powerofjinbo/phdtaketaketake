services:
  - type: web
    name: phdtake-api
    runtime: python
    plan: free
    rootDir: app/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://powerofjinbo.github.io
