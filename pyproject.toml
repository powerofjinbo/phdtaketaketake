[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phdtaketaketake"
version = "0.1.0"
description = "Connection-first PhD advisor matcher — find the right advisor by network strength, not h-index."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Jinbo Z" }]
keywords = [
    "phd",
    "graduate-school",
    "academic-matching",
    "advisor",
    "phd-application",
    "connection-graph",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=2.5"]
dev = [
    "pytest>=7.4",
    "ruff>=0.3",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/powerofjinbo/phdtaketaketake"
Repository = "https://github.com/powerofjinbo/phdtaketaketake"
Issues = "https://github.com/powerofjinbo/phdtaketaketake/issues"

# Sprint-3-c5: console scripts. After `pip install`, the CLIs below
# are available on $PATH without needing the scripts/ directory.
# (Sprint-4-c3 added phdtaketaketake-export-schemas.)
[project.scripts]
phdtaketaketake-match            = "phd_matcher.cli.match:main"
phdtaketaketake-audit            = "phd_matcher.cli.audit_candidates:main"
phdtaketaketake-collect-evidence = "phd_matcher.cli.collect_evidence:main"
phdtaketaketake-discovery-plan   = "phd_matcher.cli.build_discovery_plan:main"
phdtaketaketake-export-schemas   = "phd_matcher.cli.export_schemas:main"
# Sprint-7: CV optimization sub-skill.
phdtaketaketake-cv-template      = "phd_matcher.cv.cli.template:main"

[tool.hatch.build.targets.wheel]
packages = ["phd_matcher"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
# Allow compact `if x: return y` style — used in the scoring tables for
# readability (each branch is a single dictionary-like lookup rule).
ignore = ["E701"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
