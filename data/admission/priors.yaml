# Admission-probability priors (phd_matcher.admission).
#
# These are MODEL PARAMETERS, not facts about any candidate or program.
# They play the same role as TIER_WEIGHTS in scoring/admit.py: educated
# defaults, chosen from public department admissions pages, NSF/CGS
# graduate-admissions reports and widely reported cycle statistics, and
# meant to be replaced as soon as better data exists:
#
#   * A verified program statistic (ProgramAdmissionStats with evidence)
#     always overrides `base_rates` for that target.
#   * `phdtaketaketake-admission --calibrate outcomes.json` refits the
#     `calibration` block from real admit / reject outcomes.
#
# base_rates: P(offer) for a random applicant to a program of that tier,
#   before anything is known about them. Overall offers / applications.
# admission_model_prior: P(the PI personally decides) when the program's
#   admission model is unknown. 1.0 = direct-admit, 0.0 = committee /
#   rotation (advisor chosen after admission).
# core_course_keywords: substrings (case-insensitive, en + zh) that mark a
#   transcript course as core to the field when the course itself does not
#   say `is_core`.
# subject_gre_weight: index weight of the Subject GRE when one is reported.

calibration:
  intercept_shift: 0.0      # added to every target's logit
  beta_multiplier: 1.0      # scales the applicant-index slope

post_interview_rates:       # P(offer | interviewed) by tier
  top_10: 0.40
  top_11_30: 0.50
  top_31_60: 0.55
  top_60_plus: 0.60

waitlist_rates:             # P(offer | waitlisted) by tier
  top_10: 0.20
  top_11_30: 0.25
  top_31_60: 0.30
  top_60_plus: 0.35

default:
  base_rates: {top_10: 0.10, top_11_30: 0.15, top_31_60: 0.22, top_60_plus: 0.32}
  admission_model_prior: 0.5
  subject_gre_weight: 0.03
  core_course_keywords: []

